<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" role="img" aria-label="How often ranges separate when nothing differs">
<title>How often ranges separate when nothing differs</title>
<style>text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif}.f-card{fill:#151B23}.f-node{fill:#0D1117}.f-soft{fill:#262C36}.f-bar{fill:#8B949E}.f-accent{fill:#A68BFA}.f-tint{fill:#251E3D}.t-ink{fill:#E6EDF3}.t-muted{fill:#9198A1}.t-accent-text{fill:#C9B8FF}.t-on-accent{fill:#0D1117}.s-hairline{stroke:#3D444D}.s-grid{stroke:#262C36}.s-flow{stroke:#768390}.s-accent{stroke:#A68BFA}.s-bar{stroke:#8B949E}</style>
<rect x="0.5" y="0.5" width="719" height="299" rx="12" class="f-card s-hairline" stroke-width="1"/>
<text x="24.0" y="34.0" font-size="17" font-weight="600" text-anchor="start" class="t-ink">How often ranges separate when nothing differs</text>
<text x="24.0" y="56.0" font-size="12.5" text-anchor="start" class="t-muted">Two groups of n processes drawn from the same distribution: chance that one group&#x27;s range lies</text>
<text x="24.0" y="74.0" font-size="12.5" text-anchor="start" class="t-muted">entirely below the other&#x27;s (either direction) = 2 / C(2n, n). The report prints it under each table.</text>
