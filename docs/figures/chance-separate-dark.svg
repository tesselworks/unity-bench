<line x1="68.0" y1="116.0" x2="696.0" y2="116.0" class="s-grid" stroke-width="1"/>
<text x="60.0" y="120.0" font-size="12" text-anchor="end" class="t-muted">100%</text>
<rect x="91.0" y="116.0" width="58.6" height="138.0" rx="3" class="f-bar"/>
<text x="120.3" y="109.0" font-size="13" font-weight="600" text-anchor="middle" class="t-ink">100%</text>
<text x="120.3" y="272.0" font-size="12" text-anchor="middle" class="t-ink">1 vs 1</text>
