<rect x="0.5" y="0.5" width="859" height="471" rx="12" class="f-card s-hairline" stroke-width="1"/>
<text x="24.0" y="34.0" font-size="17" font-weight="600" text-anchor="start" class="t-ink">Workloads: where they run and how much code they need</text>
<text x="24.0" y="56.0" font-size="12.5" text-anchor="start" class="t-muted">Every Editor workload and the scene workloads also record a memory breakdown. Keys: docs/workloads.md.</text>
<text x="138.0" y="104.0" font-size="13" font-weight="600" text-anchor="start" class="t-ink">No code</text>
<text x="138.0" y="121.0" font-size="12" text-anchor="start" class="t-muted">built-in, any project</text>
<text x="378.0" y="104.0" font-size="13" font-weight="600" text-anchor="start" class="t-ink">Hooks in the game</text>
<text x="378.0" y="121.0" font-size="12" text-anchor="start" class="t-muted">a scene workload plus Bench calls</text>
