# Example campaign: every built-in workload plus one project adapter, on the tiny project in minimal-unity/.
# Edit the two editor paths, then:   python3 unity-bench.py run examples/minimal.toml
name = "minimal-example"

[project]
path = "minimal-unity"           # relative to this file; copied per variant, your working tree is never touched

[defaults]
repeats = 3                      # fresh Editor processes per variant per workload (the unit of repeat)
rounds = 4                       # iterations inside one Editor process (round 0 is labelled first-use)
baseline = "unity-6.7"           # ratios are other / baseline

# Player build settings to hold equal across Editors (names as each Editor spells the enum values; omit to keep the project's own):
# [build]
# api_compatibility = "NET_Standard"
# il2cpp_code_generation = "OptimizeSpeed"
# stripping = "Minimal"

# Where each process starts (see docs/methodology.md#cache-states). The defaults keep each kind's old behaviour: cold_open is `cold`, the rest `as-is`.
# `state = "warm"` on a workload restores the snapshot of the prepared project copy before every process; `cold` also isolates the global caches.
# [cache]
# isolate = ["compilation", "upm", "accelerator"]   # what `cold` points at empty directories; [] makes `cold` only delete Library

[[variants]]
id = "unity-6.7"
editor = "/Applications/Unity/Hub/Editor/6000.7.0b2/Unity.app/Contents/MacOS/Unity"
# Windows: "C:/Program Files/Unity/Hub/Editor/6000.7.0b2/Editor/Unity.exe"
backend = "mono"                 # scripting backend of the player builds
# code_optimization = "release"  # Editor code optimization: debug | release (omit to keep the Editor's own setting)
# To measure Debug and Release of both Editors, use four variants and name each one's baseline:
#   unity-6.7-debug (baseline), unity-6.7-release (baseline = "unity-6.7-release"),
#   unity-7-debug, unity-7-release (baseline = "unity-6.7-release"); each Unity 7 variant is compared with its 6.7 pair.
# revision = "<git commit>"      # build this variant from a different commit of the project's repository

[[variants]]
id = "unity-7"
editor = "/Applications/Unity/Hub/Editor/7000.0.0a9/Unity.app/Contents/MacOS/Unity"
backend = "coreclr"

[[workloads]]
id = "cold-open"
kind = "editor.cold_open"
repeats = 4                      # the first open of each project copy is first-use (import, and migration on a newer Editor)
headline = true                  # items an aggregate may include; without it a workload gets no geometric mean

[[workloads]]
id = "warm-open"
kind = "editor.warm_open"
# state = "warm"                 # every process starts from the prepared copy's snapshot instead of from what the last one left
repeats = 4
headline = true

[[workloads]]
id = "script-edit"
kind = "editor.script_edit"
targets = [
  { id = "leaf",     path = "Assets/FeatureA/FeatureA.cs", change = "comment" },   # nothing depends on it
  { id = "core",     path = "Assets/Core/Work.cs",         change = "comment" },   # every other assembly references it
  { id = "core-api", path = "Assets/Core/Work.cs",         change = "api" },       # public API change: dependents recompile too
]
headline = ["*/compile+reload"]  # item-name patterns: the edit-to-running time is the result, compile alone is a part of it

[[workloads]]
id = "play-default"
kind = "editor.play"
domain_reload = "default"        # the project's own Enter Play Mode settings

[[workloads]]
id = "play-no-domain-reload"
kind = "editor.play"
domain_reload = "disabled"       # Enter Play Mode options: Reload Domain off

# Memory. Every Editor workload above also reads its process's memory (start, end, peak) and the report shows it as a table; `memory = false` turns that off.
# The leak workloads edit a script and reload N times (or enter and leave Play Mode N times) in ONE Editor and read memory after each cycle, after a forced
# collection. The report gives first and last value and the slope per cycle (MB) per counter. `rounds` here is the number of cycles (defaults: 30 and 10).
[[workloads]]
id = "reload-leak"
kind = "editor.reload_leak"
targets = [{ id = "leaf", path = "Assets/FeatureA/FeatureA.cs", change = "comment" }]   # as editor.script_edit
rounds = 30
repeats = 2
# force_gc = false             # read without collecting first
# memory_snapshot = true       # a Memory Profiler .snap at the end (needs com.unity.memoryprofiler in the project; recorded as skipped without it)

[[workloads]]
id = "play-leak"
kind = "editor.play_leak"
rounds = 10
repeats = 2
domain_reload = "default"        # or "disabled"

[[workloads]]
id = "hash-adapter"
kind = "editor.adapter"
method = "UnityBench.Example.HashAdapter.Run"
args = { sha256_blocks = 32 }

[[workloads]]
id = "build-time"
kind = "player.build_time"
mode = "clean"
rounds = 2                       # round 0 is first-use; builds are slow, keep this small
repeats = 2

[[workloads]]
id = "startup"
kind = "player.startup"
build = "build-time"             # launch the player that build-time produced for each variant
repeats = 4

[[workloads]]
id = "frames"
kind = "player.adapter"
method = "UnityBench.Example.PlayerAdapter.Run"
args = { frames = 600, warmup_frames = 60 }
build = "build-time"             # omit to build once per variant, backend and scene list (workloads with the same settings share it)
headless = true                  # -batchmode -nographics; false opens a window
repeats = 4
rounds = 3

# Scene workloads: play a scene of the project and record frames, profiler markers, GC and memory. No code in the project is needed.
# Bodies.unity makes no Unity Bench call (the report says "work not verified"); BodiesHooked.unity is the same scene with Bench.Mark / Bench.Begin / Bench.End
# calls (the Work column then reads "same" or "differs"). A fixed frame count with a fixed delta makes every variant simulate the same frames.
[[workloads]]
id = "scene-play"
kind = "editor.scene_play"       # Play Mode in the batchmode Editor (no GPU, so no rendering markers)
scene = "Assets/Scenes/Bodies.unity"
warmup_frames = 60
duration_frames = 300
time = { capture_delta = 0.016667, fixed_timestep = 0.02 }
repeats = 3

[[workloads]]
id = "scene-play-hooked"
kind = "editor.scene_play"
scene = "Assets/Scenes/BodiesHooked.unity"
warmup_frames = 60
duration_frames = 300
time = { capture_delta = 0.016667, fixed_timestep = 0.02 }
repeats = 3

[[workloads]]
id = "scene"
kind = "player.scene"            # a built player, a fresh process per repeat; the player is built once per variant and scene
scene = "Assets/Scenes/Bodies.unity"
warmup_seconds = 2               # or warmup_frames
duration_seconds = 10            # or duration_frames
headless = false                 # a window, so the rendering markers exist; true = -batchmode -nographics
repeats = 3

[[workloads]]
id = "scene-hooked"
kind = "player.scene"
scene = "Assets/Scenes/BodiesHooked.unity"
warmup_frames = 60
duration_frames = 600            # a fixed number of frames, so work counters that depend on frames are comparable
time = { capture_delta = 0.016667, fixed_timestep = 0.02 }
repeats = 3
